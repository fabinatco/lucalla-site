<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucalla | Preparation check</title><style>body{font:18px system-ui;max-width:700px;margin:40px auto;padding:24px;color:#18384a;background:#f2f8fa}button{padding:16px;border:1px solid #547889;border-radius:12px;font:inherit;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:12px}</style><h1>Preparation check only</h1><p>Fictional test data only. No microphone, voice connection, appointment or credit use. Voice start is disabled and needs separate approval.</p><button id="prepare">Run preparation check</button><pre id="status">Not run.</pre><p><a href="./workspace.en.html#calendar">Back to workspace</a></p><script type="module">
const status=document.querySelector('#status');window.preparationDiagnostics={socketAttempts:0,providerActive:false};
const OriginalWebSocket=window.WebSocket;window.WebSocket=class{constructor(){window.preparationDiagnostics.socketAttempts++;throw Error('Voice connection forbidden during this preparation check')}};
document.querySelector('#prepare').onclick=async()=>{document.querySelector('#prepare').disabled=true;try{const token=localStorage.getItem('lc_s');if(!token)throw Error('Sign in first');const r=await fetch('https://account.lucalla.com/receptionist/conversation/prepare',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}',cache:'no-store'}),p=await r.json();if(!r.ok)throw Error('Preparation unavailable (HTTP '+r.status+')');if(p.preparationOnly!==true||p.providerStartAllowed!==false||p.providerActive!==false||p.preparedOnly!==true||p.calendarProposals!==false||p.preparationVersion!=='grant-bound-v2'||p.grantBinding!=='92c0ab141751d5965b9caf4078df09c659fd615d00ec784def6491f7fba94687'||p.expires<Date.now()+5000)throw Error('Preparation scope not verified');window.preparationDiagnostics={...window.preparationDiagnostics,passed:true,preparationVersion:p.preparationVersion,grantBinding:p.grantBinding,expires:p.expires,providerActive:p.providerActive,providerStartAllowed:p.providerStartAllowed,calendarProposals:p.calendarProposals};status.textContent='Preparation passed.\nNo voice connection. No appointment.\nVoice start remains disabled. Session expires in at most 120 seconds.'}catch(e){window.preparationDiagnostics.error=e.message;status.textContent=e.message}};
</script></html>
